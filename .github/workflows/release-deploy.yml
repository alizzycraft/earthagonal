name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        body: |
          ## Release ${{ github.ref_name }}
          
          ### 🚀 Features
          - Mobile pinch-to-zoom support with device-specific sensitivity
          - Touch-optimized controls for mobile devices
          - Improved user experience across all devices
          
          ### 📱 Mobile Improvements
          - Responsive zoom controls that adapt to device type
          - Touch gesture support for cell selection
          - Optimized sensitivity for mobile touch interactions
          
          ### 🔧 Technical
          - Babylon.js ArcRotateCamera touch configuration
          - Device detection for mobile/desktop differentiation
          - CSS touch-action optimization for mobile browsers
          
          ---
          
          **Installation**: Visit https://alizzycraft.github.io/earthagonal/
